name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps on the emulator or a device.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "emulator API 34 / Pixel 7, Android 15"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `adb logcat -s ZeroClaw` lines. Remove personal data before posting.
      render: text
