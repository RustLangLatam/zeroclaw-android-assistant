name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache native release archives
        uses: actions/cache@v4
        with:
          path: .zeroclaw
          key: native-${{ hashFiles('app/build.gradle.kts') }}
      # No local.properties: model and service keys are empty, which the build accepts.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug build
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
